# Torob (تربچه) evaluation scenarios: every expectation written BEFORE the first run (2026-10-23).
#
# Turn syntax:   "text"                    a typed message
#                "chip: <label>"           tap the chip/button with that label from the previous turn
#                "card<N>: <label>"        tap the button of the N-th card (1-based) of the latest card block
#                "set: key=value,..."      a conditions-strip change (POST /api/refine)
#                "loc: <area>"             pick an area (set_location chip with /api/areas coordinates)
#                "gps: lat,lng"            GPS location
#                "http: {json}"            raw POST /api/chat body (endpoint and forgery cases)
# setup.clock:   demo time (Tehran) for the whole scenario; default 2026-10-22T17:00 (a Thursday afternoon)
#
# Per-turn expect keys (all optional; checked in code by grade.py):
#   intent:    router intent(s) the model must pick (need, named_product, refine, call_shop, ask_results, hub, show_shops, other)
#   must_show: block kinds that must appear: products, shops, question, message, call, plan, hub, ui, alternative
#   must_not:  products, shops, search (= products or shops), error, english, leak, latin_digits, question,
#              invented_budget, repeat_question, call
#   facts:     named dataset checks:
#              budget=<toman> | budget=none | within_budget | shops_sell_product | open_flag_consistent |
#              cheapest_le_median | distance_ok | no_copy_as_genuine | sim_labelled | radius=<km|none> |
#              center_moved | center_near=<lat,lng> | payment=<any|credit|credit_in_person> | arrive_set |
#              category~<substring> (at least one card's category or title contains it) | price_pref=cheap |
#              cheaper_than_before | status=<http code> | reply~<regex> | reply!~<regex>
# Scenario-level: tone (what the Persian must be like) and ideal (the best possible reply, judged by the LLM judge).

defaults:
  clock: "2026-10-22T17:00"
  tone: "فارسی محاوره‌ای، کوتاه، حداکثر یک سؤال، بدون اصطلاح فنی یا انگلیسی"

scenarios:

# ─────────────── 1. Clear needs (15) ───────────────
- id: clear-01
  group: clear
  persona: دانشجو، کوتاه می‌نویسد
  turns: ["هندزفری بلوتوث تا ۲ میلیون"]
  expect:
  - {intent: need, must_show: [products], must_not: [error, english, leak], facts: [budget=2000000, within_budget, "category~هندزفری|هدفون|هدست"]}
  ideal: "۲ تا ۳ هندزفری بی‌سیم واقعی (نه دانگل یا قاب) زیر ۲ میلیون با فروشنده‌ی نزدیک، و حداکثر یک سؤال کوتاه."
- id: clear-02
  group: clear
  persona: پدر خانواده
  turns: ["یه پاوربانک ۲۰ هزار میخوام"]
  expect:
  - {must_show: [products], must_not: [error, invented_budget], facts: [budget=none, "category~پاوربانک|شارژر همراه"]}
  ideal: "پاوربانک‌های ۲۰٬۰۰۰ میلی‌آمپر (نه بودجه‌ی ۲۰ هزار تومان) با قیمت ثبت‌شده."
- id: clear-03
  group: clear
  persona: خانم میانسال
  turns: ["سشوار خوب میخوام برای خونه"]
  expect:
  - {must_not: [error, english], facts: ["category~سشوار|حالت دهنده|مو"]}
  ideal: "چند سشوار خانگی با قیمت ثبت‌شده، یا یک سؤال کوتاه درباره‌ی بودجه با دکمه."
- id: clear-04
  group: clear
  persona: کارمند
  turns: ["شارژر دیواری ۲۵ وات سامسونگ اصل"]
  expect:
  - {must_show: [products], must_not: [error], facts: ["category~شارژر", no_copy_as_genuine]}
  ideal: "شارژرهای ۲۵ وات سامسونگ با قیمت باورپذیر؛ کپی‌های احتمالی جدا با یک خط هشدار."
- id: clear-05
  group: clear
  persona: گیمر نوجوان
  turns: ["ماوس گیمینگ زیر ۱ میلیون"]
  expect:
  - {must_show: [products], facts: [budget=1000000, within_budget, "category~ماوس"]}
  ideal: "۲ تا ۳ ماوس گیمینگ زیر یک میلیون با فروشنده‌ی نزدیک."
- id: clear-06
  group: clear
  persona: هدیه‌خر
  turns: ["برای تولد دوست‌دخترم یه ساعت مچی میخوام تا ۵ میلیون"]
  expect:
  - {must_show: [products], must_not: [error], facts: [budget=5000000, within_budget, "category~ساعت"]}
  ideal: "چند ساعت مچی زنانه‌ی مناسب هدیه زیر ۵ میلیون، با لحن گرم و کوتاه."
- id: clear-07
  group: clear
  persona: تکنسین
  turns: ["دوربین مدار بسته بیرونی ۲ مگاپیکسل"]
  expect:
  - {must_show: [products], facts: ["category~دوربین"]}
  ideal: "دوربین‌های مداربسته‌ی بیرونی ۲ مگاپیکسل از دیتاست."
- id: clear-08
  group: clear
  persona: دانشجو
  turns: ["کابل شارژ تایپ سی"]
  expect:
  - {must_show: [products], facts: ["category~کابل"]}
  ideal: "کابل‌های USB-C ارزان و پرفروشنده با قیمت ثبت‌شده."
- id: clear-09
  group: clear
  persona: صاحب‌خانه
  turns: ["لامپ ال ای دی ۱۲ وات"]
  expect:
  - {must_show: [products], facts: ["category~لامپ|چراغ"]}
  ideal: "لامپ‌های LED ۱۲ وات با قیمت و فروشنده‌ی نزدیک."
- id: clear-10
  group: clear
  persona: مرد جوان
  turns: ["گوشی سامسونگ A55"]
  expect:
  - {intent: [named_product, need], must_show: [products], facts: ["category~گوشی"]}
  ideal: "گلکسی A55 با نسخه‌های حافظه‌اش و فروشنده‌ها، بدون قاب یا گلس."
- id: clear-11
  group: clear
  persona: ورزشکار
  turns: ["هندزفری برای باشگاه که با عرق خراب نشه"]
  expect:
  - {must_show: [products], must_not: [error], facts: ["category~هندزفری|هدفون|هدست"]}
  ideal: "هندزفری‌های ضد عرق/ضد آب و یک مقایسه که مقاومت در برابر آب را نشان دهد."
- id: clear-12
  group: clear
  persona: مادر
  turns: ["کیف و کاور گوشی آیفون ۱۳"]
  expect:
  - {must_show: [products], facts: ["category~کیف|کاور|قاب"]}
  ideal: "قاب‌های آیفون ۱۳ (نه خود گوشی) با قیمت ثبت‌شده."
- id: clear-13
  group: clear
  persona: برقکار
  turns: ["سیم افشان ۲.۵ کابل‌سازی"]
  expect:
  - {must_show: [products], facts: ["category~سیم"]}
  ideal: "سیم‌های افشان ۲٫۵ با قیمت متری روشن."
- id: clear-14
  group: clear
  persona: دانشجوی معماری
  turns: ["اسپیکر بلوتوث جیبی ارزون"]
  expect:
  - {must_show: [products], must_not: [invented_budget], facts: ["category~اسپیکر", price_pref=cheap]}
  ideal: "ارزان‌ترین اسپیکرهای بلوتوث کوچک مرتبط، بدون ساختن بودجه."
- id: clear-15
  group: clear
  persona: پیرمرد
  turns: ["عینک آفتابی مردانه"]
  expect:
  - {must_show: [products], facts: ["category~عینک"]}
  ideal: "چند عینک آفتابی مردانه با قیمت و فروشنده‌ی نزدیک."

